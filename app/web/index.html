<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智影课堂 - AI黑板笔记助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="logo">
        <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
          <rect x="4" y="6" width="40" height="30" rx="6" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.65)" stroke-width="2"/>
          <path d="M10 14h10M10 20h16M10 26h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="33" cy="24" r="7" fill="none" stroke="#ffe58a" stroke-width="2.4"/>
          <path d="M33 17v14M26 24h14" stroke="#ffe58a" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="hero-text">
        <h1>智影课堂</h1>
        <p class="sub">拍下黑板，自动矫正拉正 · 清晰增强 · AI 整理成结构化课堂笔记</p>
      </div>
      <span class="hero-badge">AIC 2026 参赛作品</span>
    </div>
  </header>

  <main>
    <section id="dropzone" class="dropzone">
      <div class="dz-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
          <path d="M12 16V4m0 0L7 9m5-5l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <div class="dz-inner">
        <strong>拖拽黑板照片到这里</strong>
        <span>或点击选择文件（可多选，支持 jpg / png / bmp）</span>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </section>

    <section id="status" class="status hidden"></section>

    <section id="toolbar" class="toolbar hidden">
      <button id="batchNoteBtn" class="btn batch-btn">一键生成全部笔记</button>
      <span id="batchInfo" class="batch-info"></span>
      <label class="fast-switch">
        <input type="checkbox" id="fastMode">
        快速模式（速度优先，识别精度略降）
      </label>
    </section>

    <section id="gallery" class="gallery"></section>
  </main>

  <footer>
    <span>第8届 AIC 算法创新赛道 · AI+软件创新</span>
    <span>本地运行 · 数据不出本机（OCR/LLM 为在线智能服务）</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
